name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pianoforge
          POSTGRES_PASSWORD: pianoforge
          POSTGRES_DB: pianoforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pianoforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic
      - name: Type check
        run: mypy src
      - name: Migrations are in sync with models
        env:
          PF_DATABASE_URL: postgresql+psycopg://pianoforge:pianoforge@localhost:5432/pianoforge_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        env:
          PF_TEST_DATABASE_URL: postgresql+psycopg://pianoforge:pianoforge@localhost:5432/pianoforge_test
          PF_TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest tests -q
