[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pianoforge"
version = "0.2.0"
description = "PianoForge backend: FastAPI API, Celery workers, audio analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "boto3>=1.34",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.12",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
# Heavy ML engines. Absent -> AdapterRegistry falls back to DSP implementations.
ml = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "demucs>=4.0.1",
    "basic-pitch[onnx]>=0.4",
]
beats = ["madmom>=0.16.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "moto[s3,server]>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pianoforge-api = "pianoforge.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pianoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: requires PostgreSQL and Redis (PF_TEST_DATABASE_URL, PF_TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships without type hints; its task/signal decorators are untyped.
module = ["pianoforge.worker.*"]
disallow_untyped_decorators = false
